services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:8.10.1
    ports:
      - '6379:6379'

volumes:
  pgdata: